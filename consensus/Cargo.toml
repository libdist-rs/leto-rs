[package]
name = "leto"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0"
log4rs = "1"
clap = "4"
crypto = { package = "libcrypto", git = "https://github.com/libdist-rs/libcrypto-rs.git" }
storage = { package = "libstorage-rs", git = "https://github.com/libdist-rs/libstorage-rs.git" }
mempool = { package = "libmempool-rs", git = "https://github.com/libdist-rs/libmempool-rs.git" }
tcp-sender = { git = "https://github.com/libdist-rs/libnet-rs.git" }
tcp-reliable-sender = { git = "https://github.com/libdist-rs/libnet-rs.git", features = ["unbounded"] }
tcp-broadcast = { git = "https://github.com/libdist-rs/libnet-rs.git", features = ["unbounded"] }
tcp-receiver = { git = "https://github.com/libdist-rs/libnet-rs.git" }
net-common = { package = "common", git = "https://github.com/libdist-rs/libnet-rs.git" }
bytes = "1"
serde = { version = "1", features = ["derive", "rc"]}
bincode = "1"
base64 = "0"
anyhow = "1"
fnv = "1"
tokio = "1"
config = "0"
async-trait = "0"
futures-util = "0"
linked-hash-map = "0"
rand = "0.8"
once_cell = "1"

[features]
default = []
microbench = []
benchmark = []
# Compile-time signature-scheme selection in keys.rs (`#[cfg(feature = "RSA")]`).
# Off by default; declared so the cfg checks are recognised.
RSA = []